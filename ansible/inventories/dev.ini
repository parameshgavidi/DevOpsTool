# PLACEHOLDERS — swap hostnames and the Ansible service account.
# FY26: Windows Domain Service Account USA in eAccess: ucd_{EIR}_ebs
# Example: ucd_9999_ebs
#
# Ansible control node (Linux) talks WinRM to these Windows IIS servers.
# Do not put the password in this file. Use --ask-pass, Vault, or
# Jenkins credentials bound as ansible_password.

[iis_servers]
dev-web-01 ansible_host=DEV-WEB-01.example.local

[iis_servers:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_user=ucd_EIR_ebs
ansible_port=5985
environment_name=DEV
iis_site_name=GSSWeb
iis_app_pool=GSSWeb
iis_physical=C:\inetpub\wwwroot\GSSWeb
iis_http_port=80
backup_root=C:\inetpub\backups\GSSWeb
artifact_zip_name=gssweb-iis.zip
