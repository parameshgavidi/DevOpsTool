# PLACEHOLDERS — PRD. Do not run until the Change Request is approved.
# PROD may have more than one web server behind a load balancer.

[iis_servers]
prd-web-01 ansible_host=PROD-WEB-01.example.local

[iis_servers:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_user=ucd_EIR_ebs
ansible_port=5985
environment_name=PRD
iis_site_name=GSSWeb
iis_app_pool=GSSWeb
iis_physical=C:\inetpub\wwwroot\GSSWeb
iis_http_port=80
backup_root=C:\inetpub\backups\GSSWeb
artifact_zip_name=gssweb-iis.zip
